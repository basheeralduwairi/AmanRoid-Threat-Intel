name: Publish reviewed Jordan advisories
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'review/approved.json'
      - 'config/sources.json'
      - 'scripts/pipeline.py'
      - 'site/**'
      - '.github/workflows/publish-site.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/pipeline.py publish
      - name: Verify feed contains only approved records
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          feed = json.loads(Path('site/data/advisories.json').read_text())
          assert feed['publication']['human_approval_required'] is True
          for item in feed['advisories']:
              assert item['review']['status'] == 'human_approved'
              assert item['publication']['status'] == 'approved'
          print('verified', len(feed['advisories']), 'reviewed advisories')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
