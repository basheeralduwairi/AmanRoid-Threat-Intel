name: Jordan advisory discovery (review required)
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *' # 08:17 Asia/Amman (UTC+3)
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover public source links (unverified)
        run: python scripts/pipeline.py discover
      - name: Prepare non-publishing Arabic AI drafts
        env:
          THREAT_INTEL_AI_ENDPOINT: ${{ secrets.THREAT_INTEL_AI_ENDPOINT }}
          THREAT_INTEL_AI_API_KEY: ${{ secrets.THREAT_INTEL_AI_API_KEY }}
          THREAT_INTEL_AI_MODEL: ${{ vars.THREAT_INTEL_AI_MODEL }}
        run: python scripts/agent.py draft
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Upload review queue
        uses: actions/upload-artifact@v4
        with:
          name: jordan-review-queue
          path: |
            review/candidates.json
            review/drafts.json
            review/source-status.json
          retention-days: 14
