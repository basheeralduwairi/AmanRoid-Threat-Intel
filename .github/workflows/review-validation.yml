name: Validate advisory review decisions

on:
  pull_request:
    paths:
      - 'review/approved.json'
      - 'review/rejections.json'
      - 'config/sources.json'
      - 'scripts/pipeline.py'
      - 'scripts/review.py'
      - 'tests/**'
  push:
    branches: [main]
    paths:
      - 'review/approved.json'
      - 'review/rejections.json'
      - 'config/sources.json'
      - 'scripts/pipeline.py'
      - 'scripts/review.py'
      - 'tests/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/review.py validate
